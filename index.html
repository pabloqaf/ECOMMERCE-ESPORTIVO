<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportStore - E-Commerce Esportivo</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">


  <nav class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wider">⚡ SportStore</h1>
      <div class="space-x-4">
        <a href="#" class="hover:text-blue-300">Início</a>
        <a href="#produtos" class="hover:text-blue-300">Produtos</a>
        <button id="cart-btn" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold hover:bg-yellow-400">
          🛒 Carrinho (<span id="cart-count">0</span>)
        </button>
      </div>
    </div>
  </nav>


  <header class="bg-blue-800 text-white py-12 text-center">
    <h2 class="text-4xl font-extrabold mb-2">Equipe-se com os Melhores Produtos</h2>
    <p class="text-lg text-blue-200">De tênis de corrida a equipamentos de alta performance.</p>
  </header>

 
  <main class="max-w-6xl mx-auto py-10 px-4">
    <h3 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-blue-900 pb-2">Catálogo de Produtos</h3>
    
   
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    
      <p class="text-gray-500 col-span-full text-center">Carregando produtos do servidor...</p>
    </div>
  </main>


  <script>
    const API_URL = 'http://localhost:3000/api/produtos';
    let cart = [];

   
    async function fetchProducts() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Erro ao buscar produtos');
        
        const products = await response.json();
        renderProducts(products);
      } catch (error) {
        console.error(error);
        document.getElementById('product-grid').innerHTML = `
          <div class="col-span-full text-center text-red-500 font-bold">
            Não foi possível carregar os produtos. Verifique se o backend está ligado!
          </div>
        `;
      }
    }

   
    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      
      if (products.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-500">Nenhum produto cadastrado no momento.</p>`;
        return;
      }

      grid.innerHTML = products.map(product => `
        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition duration-300 flex flex-col justify-between">
          <div class="p-5">
            <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Esporte</span>
            <h4 class="text-xl font-bold text-gray-800 mt-1">${product.nome}</h4>
            <p class="text-gray-600 text-sm mt-2">${product.descricao || 'Sem descrição cadastrada.'}</p>
          </div>
          <div class="p-5 bg-gray-50 border-t flex justify-between items-center">
            <span class="text-2xl font-extrabold text-green-600">R$ ${parseFloat(product.preco).toFixed(2)}</span>
            <button onclick="addToCart('${product.nome}')" class="bg-blue-900 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
              Adicionar
            </button>
          </div>
        </div>
      `).join('');
    }

   
    function addToCart(productName) {
      cart.push(productName);
      document.getElementById('cart-count').innerText = cart.length;
      alert(`${productName} foi adicionado ao carrinho!`);
    }

   
    fetchProducts();
  </script>
</body>
</html>
